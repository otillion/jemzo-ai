:root{--bg:#030705;--bg2:#061a0e;--acc:#3ddc84;--acc2:#1fb35e;--line:rgba(255,255,255,.13);--mut:#a9cdb8;--ink:#04210f;--glass:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:#fff;line-height:1.5;overflow-x:hidden;font-size:1.08rem}
html[lang=ar] body{font-family:"Cairo","Inter","Segoe UI",Tahoma,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.container{width:min(1280px,100% - 2.4rem);margin-inline:auto}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 85% 0%,rgba(31,179,94,.30),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(10,90,45,.45),transparent 70%),var(--bg)}
h1,h2,h3{line-height:1.05;letter-spacing:-.03em;font-weight:600}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3{letter-spacing:0;line-height:1.3}
h2{font-size:clamp(2.4rem,5.4vw,4.4rem);margin-bottom:2.2rem}
em{font-style:normal;color:var(--acc)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}.wi{display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.7rem;min-height:3.7rem;padding:.9rem 2.1rem;border-radius:999px;font-weight:700;font-size:1.12rem;transition:box-shadow .25s,background .25s,border-color .25s}
.btn-g{background:linear-gradient(135deg,#5cf09b,var(--acc2));color:#02100a;box-shadow:0 10px 40px rgba(61,220,132,.35)}
.btn-g:hover{box-shadow:0 0 0 6px rgba(61,220,132,.22),0 14px 50px rgba(61,220,132,.55)}
.btn-d{background:rgba(255,255,255,.1);border:1px solid var(--line);backdrop-filter:blur(10px)}
.btn-d:hover{background:rgba(255,255,255,.18)}
.btn-w{background:#fff;color:var(--ink)}
.btn svg{width:1.5rem;height:1.5rem;flex:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:2rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:50}
.nav .container{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:5.6rem}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:800;font-size:1.4rem}.brand img{height:2.3rem}
.menu{display:flex;gap:.3rem;padding:.35rem;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid var(--line);backdrop-filter:blur(14px)}
.menu a{padding:.65rem 1.4rem;border-radius:999px;font-weight:600;transition:background .25s,color .25s}
.menu a:hover{background:var(--acc);color:#02100a}
.nav-r{display:flex;align-items:center;gap:.7rem}
.lang{display:flex;background:rgba(0,0,0,.45);border-radius:999px;padding:.25rem;border:1px solid var(--line)}
.lang button{padding:.45rem .9rem;border-radius:999px;font-weight:700;font-size:.95rem;min-width:2.8rem;min-height:2.6rem}.lang button.on{background:var(--acc);color:#02100a}
.nav .btn{min-height:3.1rem;padding:.55rem 1.4rem}
@media(max-width:980px){.menu{display:none}}
@media(max-width:560px){.brand{font-size:1.05rem;gap:.5rem}.brand img{height:1.7rem}.lang button{padding:.3rem .45rem;min-width:2rem;min-height:2.3rem;font-size:.82rem}.nav .btn{width:2.9rem;height:2.9rem;min-height:0;padding:0}.nav .btn span{display:none}.nav .container{height:4.4rem;gap:.4rem}.nav-r{gap:.4rem}}
/* loader */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center}
#loader img{width:6.5rem;filter:drop-shadow(0 0 30px rgba(61,220,132,.8))}
/* hero */
#hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:7rem 0 3rem;overflow:hidden}
#rib{position:absolute;inset-block:0;inset-inline-end:-14%;width:72%;height:100%;pointer-events:none}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:end}
.badge{display:inline-flex;align-items:center;gap:.6rem;padding:.5rem 1.1rem;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.4);font-weight:600;font-size:.95rem;margin-bottom:1.6rem;backdrop-filter:blur(8px)}
.badge i{width:.65rem;height:.65rem;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
h1{font-size:clamp(2.7rem,6vw,5.8rem);font-weight:500;letter-spacing:-.045em}
h1 em{font-weight:700}
.hero-sub{margin:1.6rem 0 2rem;font-size:clamp(1.2rem,2vw,1.55rem);color:var(--mut);max-width:30rem}
.cta-row{display:flex;flex-wrap:wrap;gap:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.4rem;max-width:34rem}
.stat{padding:1.1rem 1.3rem;border-radius:1.4rem;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.stat b{display:block;white-space:nowrap;font-size:clamp(1.6rem,2.8vw,2.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{color:var(--mut);font-weight:600;font-size:.95rem}
.hchat{width:min(21rem,100%);margin-inline:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.6rem;direction:ltr;min-height:19rem;justify-content:flex-end}
.hchat .top{display:flex;align-items:center;gap:.7rem;padding-bottom:.7rem;border-bottom:1px solid var(--line);margin-bottom:.4rem;font-weight:700}
.hchat .top img{width:2.4rem;height:2.4rem;padding:.45rem;background:rgba(255,255,255,.1);border-radius:50%}
.hchat .top small{display:block;color:var(--acc);font-weight:600;font-size:.8rem}
.msg{max-width:88%;padding:.7rem 1rem;border-radius:1.1rem;font-size:1.02rem;opacity:0}
.msg small{display:block;opacity:.6;font-size:.7rem;text-align:end}
.msg.in{align-self:flex-start;background:rgba(255,255,255,.12);border-end-start-radius:.3rem}
.msg.out{align-self:flex-end;background:linear-gradient(135deg,#34d57a,#14935a);color:#02100a;font-weight:700;border-end-end-radius:.3rem}
.typing{align-self:flex-end;display:none;gap:.3rem;padding:.8rem 1rem;background:rgba(61,220,132,.35);border-radius:1.1rem}
.typing i{width:.45rem;height:.45rem;background:#fff;border-radius:50%;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.3;transform:translateY(-3px)}}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.hchat{display:none}#rib{width:120%;inset-inline-end:-35%;opacity:.55}#hero{align-items:flex-end;padding-bottom:2.5rem}}
/* bento */
section.s{padding:6rem 0}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:1.2rem}
.bc{position:relative;min-height:16rem;padding:2rem;border-radius:2rem;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line)}
.bc .n{font-size:clamp(2.6rem,4.5vw,3.8rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.bc h3{font-size:clamp(1.6rem,2.6vw,2.2rem);margin-bottom:.5rem}
.bc p{font-size:1.15rem;font-weight:500;opacity:.85}
.bc.w1{grid-column:span 5;background:#fff;color:var(--ink)}.bc.w1 .n{color:var(--acc2)}
.bc.g1{grid-column:span 7;background:linear-gradient(135deg,#1fb35e 0%,#0b6a35 55%,#04301a 100%);color:#fff}
.bc.g2{grid-column:span 7;background:linear-gradient(225deg,#1fb35e 0%,#0b6a35 55%,#04301a 100%);color:#fff}
.bc.d1{grid-column:span 5;background:var(--glass);backdrop-filter:blur(14px)}.bc.d1 .n{color:var(--acc)}
.bc.g1::after,.bc.g2::after{content:"";position:absolute;inset:-30% auto auto -10%;width:70%;height:90%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);transform:rotate(-20deg);pointer-events:none}
.bc::before{content:"";position:absolute;inset:0;background:radial-gradient(18rem circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.14),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}.bc:hover::before{opacity:1}
.bc>*{position:relative;z-index:1}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;margin-top:1.2rem}
.chip{display:flex;align-items:center;gap:1rem;padding:1.3rem 1.5rem;border-radius:1.6rem;font-weight:700;font-size:1.25rem;transition:transform .3s,border-color .3s}
.chip:hover{transform:translateY(-5px);border-color:var(--acc)}
.chip span{font-size:2.4rem}
@media(max-width:900px){.bc.w1,.bc.g1,.bc.g2,.bc.d1{grid-column:span 12;min-height:12rem}.chips{grid-template-columns:1fr 1fr}.chip{flex-direction:column;align-items:flex-start;gap:.4rem;padding:1.2rem}}
/* testimonials */
#tm{padding:2rem 0 6rem}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:1.2rem}
.tc{position:relative;padding:2rem;border-radius:2rem;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:1.4rem;overflow:hidden;transition:transform .35s,border-color .35s}
.tc:hover{transform:translateY(-6px);border-color:rgba(61,220,132,.6)}
.tc::before{content:"\201C";position:absolute;inset-block-start:-.6rem;inset-inline-end:1.2rem;font-size:9rem;line-height:1;font-weight:800;color:rgba(61,220,132,.16);font-family:Georgia,serif}
.tc q{quotes:none;font-size:clamp(1.25rem,1.9vw,1.55rem);font-weight:500;line-height:1.45;letter-spacing:-.01em;position:relative}
.tc .who{display:flex;align-items:center;gap:.9rem;margin-top:auto}
.tc .av{width:3.2rem;height:3.2rem;border-radius:50%;background:linear-gradient(135deg,#5cf09b,#1fb35e);color:#02100a;display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none;overflow:hidden}
.tc .av img{width:100%;height:100%;object-fit:cover}
.tc b{display:block;font-size:1.1rem}.tc small{color:var(--mut);font-size:.95rem}
.tc.shot{padding:.8rem}.tc.shot::before{display:none}.tc.shot img.sc{width:100%;border-radius:1.4rem;display:block}.tc.shot .who{padding:.4rem .8rem .6rem}
/* diag */
#diag .wrap{max-width:54rem;margin-inline:auto}
#diag h2{text-align:center;margin-bottom:.6rem}
.dsub{text-align:center;color:var(--mut);font-size:1.25rem;margin-bottom:2rem}
.chat{border-radius:2rem;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 80px rgba(61,220,132,.12)}
.c-top{display:flex;align-items:center;gap:.9rem;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line);font-weight:700;font-size:1.15rem}
.c-top img{width:2.6rem;height:2.6rem;padding:.5rem;background:rgba(255,255,255,.1);border-radius:50%}
.c-prog{margin-inline-start:auto;color:var(--mut);font-weight:800}
.pbar{height:4px;background:rgba(255,255,255,.1)}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#a8ffcb);transition:width .5s}
.c-log{height:min(19rem,38vh);overflow-y:auto;padding:1.3rem;display:flex;flex-direction:column;gap:.8rem;scroll-behavior:smooth}
.b{max-width:88%;padding:.9rem 1.2rem;border-radius:1.3rem;font-size:1.12rem;line-height:1.45;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.b.bot{background:rgba(255,255,255,.12);align-self:flex-start;border-end-start-radius:.3rem}
.b.me{background:#fff;color:var(--ink);font-weight:700;align-self:flex-end;border-end-end-radius:.3rem}
.b.bonus{background:linear-gradient(135deg,rgba(61,220,132,.35),rgba(31,179,94,.15));border:1px solid rgba(61,220,132,.55)}
.b strong{color:var(--acc)}
.b.dots{display:flex;gap:.35rem;padding:1rem 1.2rem}.b.dots i{width:.55rem;height:.55rem;background:#fff;border-radius:50%;animation:blink 1s infinite}.b.dots i:nth-child(2){animation-delay:.15s}.b.dots i:nth-child(3){animation-delay:.3s}
.c-in{padding:1.1rem 1.3rem 1.4rem;border-top:1px solid var(--line);min-height:6.5rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}.opts.one{grid-template-columns:1fr}
.opt{min-height:3.8rem;padding:.7rem 1.1rem;border-radius:1.1rem;background:#fff;color:var(--ink);font-weight:700;font-size:1.08rem;text-align:start;display:flex;align-items:center;gap:.7rem;line-height:1.25;transition:transform .2s,box-shadow .2s,background .2s}
.opt:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(61,220,132,.4);background:#eaffef}.opt .e{font-size:1.5rem}
.field{display:flex;gap:.7rem}
.field input{flex:1;min-height:3.8rem;padding:.7rem 1.2rem;border-radius:1.1rem;border:2px solid transparent;background:#fff;color:var(--ink);font:inherit;font-weight:600;min-width:0}.field input:focus{outline:0;border-color:var(--acc)}
.field .btn{min-height:3.8rem;padding:.6rem 1.5rem}
.done{display:grid;gap:.7rem;justify-items:center}.back{color:var(--mut);font-weight:600;text-decoration:underline;text-underline-offset:4px;font-size:.95rem}
.done .btn{width:100%}
@media(max-width:520px){.opts{grid-template-columns:1fr}.field{flex-direction:column}}
/* packages */
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;align-items:end}
.pk{position:relative;padding:2rem;border-radius:2rem;display:flex;flex-direction:column;gap:1.4rem;min-height:25rem;background:linear-gradient(160deg,#171c19,#0c100e);border:1px solid var(--line)}
.pk h3{font-size:2rem}
.pk ul{list-style:none;display:grid;gap:.9rem;margin-bottom:auto}
.pk li{display:flex;gap:.7rem;font-weight:600;font-size:1.15rem}.pk li::before{content:"✓";color:var(--acc);font-weight:900}
.pk .btn{width:100%}
.pk.hot{min-height:28rem;border-color:var(--acc);background:linear-gradient(160deg,#0f5c30,#06220f);box-shadow:0 0 70px rgba(61,220,132,.25);margin-top:3rem}
.pk .tag{position:absolute;inset:-3rem 0 auto 0;height:3.4rem;border-radius:1.6rem 1.6rem 0 0;background:linear-gradient(135deg,#5cf09b,#1fb35e);color:#02100a;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:1.1rem;z-index:-1;padding-bottom:.4rem}
@media(max-width:900px){.pk-grid{grid-template-columns:1fr}.pk,.pk.hot{min-height:0}.pk.hot{margin-top:3rem}}
/* cta */
#cta{padding:7rem 0 8rem;text-align:center;position:relative}
#cta h2{font-size:clamp(3rem,9vw,8rem);font-weight:500;letter-spacing:-.05em;margin-bottom:2rem}
#cta .cta-row{justify-content:center}
footer{padding:2rem 0 6rem;border-top:1px solid var(--line);color:var(--mut)}
footer .container{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;align-items:center}
.wa-float{position:fixed;inset-block-end:1.2rem;inset-inline-end:1.2rem;z-index:60;width:4.2rem;height:4.2rem;border-radius:50%;background:linear-gradient(135deg,#5cf09b,var(--acc2));display:grid;place-items:center;box-shadow:0 10px 35px rgba(61,220,132,.55)}
.wa-float::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:ring 2.2s infinite}@keyframes ring{to{transform:scale(1.7);opacity:0}}
.wa-float svg{width:2.2rem;height:2.2rem;fill:#02100a}
.cursor{position:fixed;z-index:200;left:0;top:0;width:2.4rem;height:2.4rem;border:2px solid var(--acc);border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s;mix-blend-mode:screen}.cursor.big{width:4.4rem;height:4.4rem;background:rgba(61,220,132,.18)}
@media(hover:none){.cursor{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.pk{cursor:pointer}</style>
</head>

function initScroll(){
  ScrollTrigger.getAll().forEach(function(s){s.kill(true)});
  if(!reduce){
    gsap.from("#h1 .wi",{yPercent:115,duration:1,ease:"power4.out",stagger:.07});
    gsap.from([".badge",".hero-sub",".cta-row",".stat",".hchat"],{y:40,autoAlpha:0,duration:.9,ease:"power3.out",stagger:.1,delay:.3});
    $$("section.s h2,#tm h2,.tc,.bc,.chip,.pk,.chat,.dsub").forEach(function(el){gsap.from(el,{y:60,autoAlpha:0,duration:.9,ease:"power3.out",scrollTrigger:{trigger:el,start:"top 90%",once:true}})});
    gsap.to("#rib",{yPercent:12,ease:"none",scrollTrigger:{trigger:"#hero",start:"top top",end:"bottom top",scrub:true}});
    gsap.from("#cta h2",{scale:.9,autoAlpha:0,duration:1,scrollTrigger:{trigger:"#cta",start:"top 80%",once:true}});
  }
  ScrollTrigger.refresh();
}
/* ===== diagnosis ===== */
var S={},cl,ci;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bubble(h,c){var d=document.createElement("div");d.className="b "+c;d.innerHTML=h;cl.appendChild(d);cl.scrollTop=cl.scrollHeight;return d}
function botSay(h,cb,bonus,delay){var dots=bubble("<i></i><i></i><i></i>","bot dots");setTimeout(function(){dots.remove();bubble(h,"bot"+(bonus?" bonus":""));cb&&cb()},delay!=null?delay:(reduce?0:650))}
function progress(n){$("#pbar").style.width=(n/5*100)+"%";$("#cprog").textContent=n+" / 5"}
function opts(list,pick,one){ci.innerHTML='<div class="opts'+(one?" one":"")+'"></div>';var w=$(".opts",ci);
  list.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.innerHTML=(o.e?'<span class="e">'+o.e+"</span>":"")+"<span>"+o.t+"</span>";b.onclick=function(){pick(o,i)};w.appendChild(b)});bindUI()}
function startDiag(){
  cl=$("#clog");ci=$("#cin");cl.innerHTML="";ci.innerHTML="";S={};progress(0);var D=t();
  botSay(D.q.sector,function(){opts(D.sectors.map(function(s,i){return {t:s,e:["🦷","✨","🏢","✈️"][i]}}),function(o,i){S.si=i;S.sector=o.t;bubble(esc(o.t),"me");progress(1);ci.innerHTML="";qProblem()})},false,300);
}
function qProblem(){var D=t();botSay(D.q.problem,function(){
  var list=D.pr[S.si].map(function(p){return {t:p.t}});list.push({t:D.other});
  opts(list,function(o,i){S.problem=o.t;bubble(esc(o.t),"me");progress(2);
    if(i===list.length-1){ci.innerHTML='<div class="field"><input type="text" id="oth" placeholder="'+esc(D.otherPh)+'" aria-label="'+esc(D.otherPh)+'"><button class="btn btn-g">'+D.send+'</button></div>';
      var go=function(){var v=$("#oth").value.trim();if(!v)return;S.problem=v;bubble(esc(v),"me");ci.innerHTML="";botSay("<strong>"+D.otherR+"</strong> "+D.otherB,qVol,true)};
      $(".field .btn",ci).onclick=go;$("#oth").onkeydown=function(e){if(e.key==="Enter")go()};return}
    ci.innerHTML="";var p=D.pr[S.si][i];
    botSay(p.r+"<br><strong>"+D.bonus+"</strong>"+p.b,qVol,true)})})}
function qVol(){var D=t();botSay(D.q.volume,function(){opts(D.vol.map(function(v){return {t:v}}),function(o,i){S.vi=i;S.volume=o.t;bubble(esc(o.t),"me");progress(3);ci.innerHTML="";qAds()})})}
function qAds(){var D=t();botSay(D.q.ads,function(){opts(D.ad.map(function(v){return {t:v}}),function(o,i){S.ai=i;S.ads=o.t;bubble(esc(o.t),"me");progress(4);ci.innerHTML="";botSay(D.adR[i],qLead)})})}
function qLead(){var D=t();botSay(D.q.lead,function(){
  ci.innerHTML='<div class="field"><input type="text" id="nm" autocomplete="name" placeholder="'+esc(D.leadPh)+'" aria-label="'+esc(D.leadPh)+'"><button class="btn btn-g" id="nmgo">'+D.send+'</button></div>';
  var go=function(){var v=$("#nm").value.trim();if(!v){$("#nm").focus();return}S.name=v;bubble(esc(v),"me");progress(5);ci.innerHTML="";finish()};
  $("#nmgo").onclick=go;$("#nm").onkeydown=function(e){if(e.key==="Enter")go()}})}
function finish(){
  var D=t(),pk;if(S.ai===0||S.vi===2)pk=D.pk[2].n;else if(S.vi===1||S.ai===2)pk=D.pk[1].n;else pk=D.pk[0].n;S.pkg=pk;
  try{localStorage.setItem("jemzo_diag",JSON.stringify(S))}catch(e){}
  var M=D.msg,text=[M.title,"",M.name+": "+S.name,M.sector+": "+S.sector,M.problem+": "+S.problem,M.volume+": "+S.volume,M.ads+": "+S.ads,M.pkg+": "+pk].join("\n");
  botSay(D.sum+" <strong>"+esc(pk)+"</strong>",function(){
    ci.innerHTML='<div class="done"><a class="btn btn-g" target="_blank" rel="noopener" href="'+waURL(text)+'">'+D.sumBtn+'</a><button class="back" id="again">'+D.sumAgain+'</button></div>';
    $("#again").onclick=function(){startDiag()};bindUI();try{if(window.fbq)fbq("track","Lead")}catch(e){}})}
function boot(){
  $("#yr").textContent=new Date().getFullYear();render();
  $$(".lang button").forEach(function(b){b.onclick=function(){lang=b.getAttribute("data-l");try{localStorage.setItem("jemzo_lang",lang)}catch(e){}render()}});
  if(!touch){var cur=$(".cursor");window.addEventListener("mousemove",function(e){cur.style.opacity=1;gsap.to(cur,{left:e.clientX,top:e.clientY,duration:.18})})}
  gsap.registerPlugin(ScrollTrigger);
  if(!reduce&&typeof Lenis!=="undefined"){lenis=window.lenis=new Lenis({duration:1.1});lenis.on("scroll",ScrollTrigger.update);gsap.ticker.add(function(tm){lenis.raf(tm*1000)});gsap.ticker.lagSmoothing(0)}
  var go=function(){$("#loader").remove();built=true;initHeroChat();initScroll();startDiag()};
  if(reduce)go();else gsap.timeline({onComplete:go}).fromTo("#loader img",{scale:.7,opacity:0},{scale:1,opacity:1,duration:.7,ease:"back.out(2)"}).to("#loader",{yPercent:-100,duration:.7,ease:"power4.inOut"},"+=.25");
  var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(built)ScrollTrigger.refresh()},300)});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
</body>
</html>
